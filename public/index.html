<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a2a86">
<meta name="description" content="Gera multis de futebol com as ligas, os mercados e as odds que escolhes.">
<title>Combina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho azul com resumo da multi, passos numerados em cartões brancos, barra de gerar fixa, navegação flutuante em pílula */
:root{
  --bg:#f3f6fd; --white:#ffffff; --ink:#0b1b3a; --muted:#5b6886; --faint:#94a0ba; --line:#dfe6f4;
  --blue:#1d5bff; --blue-deep:#0a2a86; --sky:#e7eeff; --sky-2:#d3e0ff;
  --danger:#d93a40; --danger-bg:#fdecec;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --shadow:0 1px 2px rgba(11,27,58,.05),0 8px 24px rgba(11,27,58,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue-deep)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* cabeçalho */
.hero{background:radial-gradient(120% 140% at 100% 0%,#3d7bff 0%,var(--blue) 38%,var(--blue-deep) 100%);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero-in{max-width:560px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:#fff;display:grid;place-items:center}
.logo i::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--blue);transform:rotate(45deg)}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:999px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.02;letter-spacing:-.03em;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:rgba(255,255,255,.82);max-width:34ch}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.summary span{font-size:13px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:10px}

.wrap{max-width:560px;margin:-44px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(190px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.wrap.plain{margin-top:-44px}

/* passos */
.step{background:var(--white);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-h b{width:24px;height:24px;border-radius:8px;background:var(--sky);color:var(--blue);font-size:13px;display:grid;place-items:center;font-weight:700;flex:none}
.step-h h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em;flex:1}
.step-h .side{font-size:13px;color:var(--muted);font-weight:600}

/* calendário */
.cal{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.cal::-webkit-scrollbar{display:none}
.day{flex:none;width:68px;border:1.5px solid var(--line);background:var(--white);border-radius:16px;padding:10px 0 9px;display:grid;justify-items:center;gap:1px}
.day small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day strong{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.day em{font-style:normal;font-size:11px;color:var(--faint);font-weight:600}
.day[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(29,91,255,.3)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:rgba(255,255,255,.85)}

/* número de jogos */
.count{display:flex;align-items:center;gap:16px}
.count .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;width:56px;text-align:center;color:var(--blue)}
.slider{flex:1;min-width:0}
.slider input{width:100%;accent-color:var(--blue);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:600;padding:0 4px}

/* seleções */
.add{width:100%;display:flex;align-items:center;gap:12px;border:1.5px dashed var(--sky-2);background:var(--sky);border-radius:16px;padding:14px 16px;color:var(--blue);font-weight:700;text-align:left}
.add svg{flex:none}
.add span{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill button{width:20px;height:20px;border-radius:50%;border:0;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none;padding:0}

/* odds */
.odds{display:grid;gap:10px}
.orow{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.orow h3{margin:0;font-size:14px;font-weight:700}
.oin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oin label{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:0 12px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.oin input{width:100%;min-width:0;border:0;background:transparent;padding:11px 0;font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.oin input:focus{outline:none}
.oin label:focus-within{box-shadow:0 0 0 2px var(--blue)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:0;background:var(--sky);color:var(--blue);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.presets button[aria-pressed="true"]{background:var(--blue);color:#fff}
.hint{color:var(--muted);font-size:14px;margin:0}
.hint b{color:var(--ink);font-weight:500}
.switch{margin-left:auto;width:48px;height:28px;border-radius:999px;border:0;background:var(--sky-2);position:relative;padding:0;flex:none;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);box-shadow:0 1px 3px rgba(11,27,58,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.target{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.tval{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:0 16px;font-weight:600;color:var(--muted);font-size:14px}
.tval:focus-within{box-shadow:0 0 0 2px var(--blue)}
.tval input{flex:1;width:0;min-width:0;border:0;background:transparent;padding:12px 0;font-family:var(--display);font-weight:800;font-size:30px;color:var(--blue);text-align:right}
.tval input:focus{outline:none}

/* barra de gerar */
.genbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.genbar-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.go{flex:1;border:0;border-radius:18px;padding:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(11,27,58,.25)}
.go svg{width:18px;height:18px}
.reset{width:56px;border:1.5px solid var(--line);border-radius:18px;background:var(--white);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}

.alert{background:var(--danger-bg);color:var(--danger);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin:4px 0 12px}

/* resultados: bilhetes */
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.res-h h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.res-h span{color:var(--muted);font-size:13px;font-weight:600}
.tickets{display:grid;gap:14px}
.ticket{background:var(--white);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.t-top{background:var(--sky);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-top small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.t-top b{font-family:var(--display);font-size:16px}
.t-odd{text-align:right}
.t-odd strong{font-family:var(--mono);font-size:26px;color:var(--blue);line-height:1}
.perf{height:14px;position:relative;background:var(--white)}
.perf::before{content:"";position:absolute;left:14px;right:14px;top:6px;border-top:2px dashed var(--line)}
.perf::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 50%,var(--bg) 7px,transparent 7.5px),radial-gradient(circle at 100% 50%,var(--bg) 7px,transparent 7.5px)}
.legs{padding:2px 18px 6px}
.leg{display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;padding:10px 0;align-items:center}
.leg + .leg{border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--blue);align-self:start;margin-top:5px}
.leg-b{min-width:0}
.leg-b .m{font-weight:700;font-size:15px;line-height:1.3}
.leg-b .p{font-size:14px;color:var(--ink);margin-top:2px}
.leg-b .p span{color:var(--muted)}
.leg-b .c{font-size:12px;color:var(--faint);font-weight:600;margin-top:3px}
.leg .o{font-family:var(--mono);font-size:15px;background:var(--bg);border-radius:10px;padding:6px 10px}
.t-foot{display:flex;align-items:center;gap:10px;padding:12px 18px 16px;flex-wrap:wrap;border-top:1px solid var(--line)}
.stake{display:flex;align-items:center;background:var(--bg);border-radius:12px;padding:0 10px;gap:4px;font-weight:700;color:var(--muted)}
.stake input{width:64px;border:0;background:transparent;padding:9px 0;font-family:var(--mono);font-size:15px;color:var(--ink)}
.stake input:focus{outline:none}
.stake:focus-within{box-shadow:0 0 0 2px var(--blue)}
.ret{font-size:13px;color:var(--muted);font-weight:600;line-height:1.2}
.ret b{display:block;font-family:var(--mono);color:var(--ink);font-size:16px;font-weight:500}
.acts{margin-left:auto;display:flex;gap:6px}
.ibtn{border:1.5px solid var(--line);background:var(--white);border-radius:12px;height:40px;padding:0 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.ibtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ibtn.warn{color:var(--danger)}

/* início */
.lg{background:var(--white);border-radius:20px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.lg h3{display:flex;align-items:center;gap:10px;margin:0;padding:14px 16px 10px;font-size:14px;font-weight:700}
.code{width:34px;height:22px;border-radius:6px;background:var(--sky);color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.04em;display:grid;place-items:center;flex:none}
.g{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.g time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.g .tm{min-width:0;font-weight:600;font-size:14px;line-height:1.4}
.g .tm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .x{display:flex;gap:4px}
.g .x span{width:46px;text-align:center;background:var(--bg);border-radius:8px;padding:4px 0;font-family:var(--mono);font-size:13px}
.g .x em{display:block;font-family:var(--body);font-style:normal;font-size:10px;font-weight:700;color:var(--faint)}
.empty{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* perfil */
.card{background:var(--white);border-radius:22px;box-shadow:var(--shadow);padding:4px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.row + .row{border-top:1px solid var(--line)}
.row p{margin:0;font-weight:700}
.row small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.mini{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.mini button{width:34px;height:34px;border:0;border-radius:9px;background:var(--white);font-size:18px;font-weight:700;color:var(--blue)}
.mini button:disabled{opacity:.35}
.mini output{width:28px;text-align:center;font-family:var(--mono);font-size:16px}
.note{color:var(--muted);font-size:13px;margin:16px 4px 0}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs-in{max-width:420px;margin:0 auto;background:var(--white);border-radius:22px;box-shadow:0 4px 30px rgba(11,27,58,.14);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;pointer-events:auto}
nav.tabs button{border:0;background:none;border-radius:16px;padding:8px 0 6px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--faint)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--sky);color:var(--blue)}

/* folha inferior */
.scrim{position:fixed;inset:0;background:rgba(11,27,58,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:88%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sh h2{font-family:var(--display);font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.sh button{width:38px;height:38px;border-radius:12px;border:0;background:var(--bg);display:grid;place-items:center}
.sb{flex:1;overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:0 14px;margin-bottom:12px;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:16px;color:var(--ink)}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--blue)}
.quick{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--blue)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow input{position:absolute;opacity:0;pointer-events:none}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;font-weight:700}
.lrow .nm small{color:var(--muted);font-size:13px}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--sky-2);display:grid;place-items:center;flex:none}
.lrow input:checked ~ .box{background:var(--blue);border-color:var(--blue)}
.lrow input:checked ~ .box::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lrow input:focus-visible ~ .box{outline:2.5px solid var(--blue);outline-offset:2px}
.lrow.off{opacity:.4;cursor:default}
.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 2px 8px}
.cat:first-of-type{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:14px;font-weight:600;line-height:1.3;cursor:pointer;display:block;min-height:56px}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile:has(input:checked){border-color:var(--blue);background:var(--sky);color:var(--blue-deep)}
.tile:has(input:checked)::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tile:has(input:focus-visible){outline:2.5px solid var(--blue);outline-offset:2px}
.tile:has(input:disabled){opacity:.4;cursor:default}
.tile small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.sf{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sf .meta{font-size:13px;color:var(--muted);font-weight:600;flex:1}
.sf .go{flex:none;padding:14px 26px;box-shadow:none;background:var(--blue)}
@media (prefers-reduced-motion:no-preference){
  .ticket{animation:rise .3s ease-out both}
  .sheet{animation:up .22s ease-out}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
  @keyframes up{from{transform:translateY(30px)}to{transform:none}}
}
.banner{background:var(--sky);color:var(--blue-deep);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:12px;box-shadow:var(--shadow)}
.link{border:0;background:none;padding:0;color:inherit;font-weight:700;text-decoration:underline}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;vertical-align:-2px;margin-right:6px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint .spin{color:var(--blue)}
.go:disabled{opacity:.8}
.ibtn.sm{height:32px;padding:0 10px;font-size:12px;margin-left:auto}
.lg h3 .lgn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .alert,.step .hint{margin:12px 0 0}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<header class="hero" id="hero"></header>
<main class="wrap" id="app"></main>
<div class="genbar" id="genbar"></div>

<nav class="tabs" aria-label="Navegação"><div class="tabs-in">
  <button data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 10h18M9 4v16"/></svg>Jogos</button>
  <button data-tab="gerar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Gerar</button>

<div id="sheet" hidden></div>

<script>
/* ================= Combina ================= */
const TZ='Europe/Lisbon';
const ymd=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
const hhmm=ts=>new Date(ts*1000).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',timeZone:TZ});

/* ---------- ligas em destaque (chaves da The Odds API) ---------- */
const CURATED=[
 ['soccer_portugal_primeira_liga','Portugal','POR','Primeira Liga'],
 ['soccer_uefa_champs_league','Europa','UEFA','Liga dos Campeões'],['soccer_uefa_europa_league','Europa','UEFA','Liga Europa'],['soccer_uefa_europa_conference_league','Europa','UEFA','Liga Conferência'],
 ['soccer_epl','Inglaterra','ENG','Premier League'],['soccer_fa_cup','Inglaterra','ENG','FA Cup'],['soccer_spain_la_liga','Espanha','ESP','La Liga'],
 ['soccer_italy_serie_a','Itália','ITA','Serie A'],['soccer_germany_bundesliga','Alemanha','GER','Bundesliga'],['soccer_germany_bundesliga2','Alemanha','GER','2. Bundesliga'],
 ['soccer_france_ligue_one','França','FRA','Ligue 1'],['soccer_netherlands_eredivisie','Países Baixos','NED','Eredivisie'],['soccer_belgium_first_div','Bélgica','BEL','Jupiler Pro League'],
 ['soccer_turkey_super_league','Turquia','TUR','Süper Lig'],['soccer_denmark_superliga','Dinamarca','DEN','Superliga'],['soccer_sweden_allsvenskan','Suécia','SWE','Allsvenskan'],
 ['soccer_switzerland_superleague','Suíça','SUI','Super League'],['soccer_austria_bundesliga','Áustria','AUT','Bundesliga'],['soccer_norway_eliteserien','Noruega','NOR','Eliteserien'],
 ['soccer_spl','Escócia','SCO','Premiership'],['soccer_brazil_campeonato','Brasil','BRA','Brasileirão']
];
// Mercados que a The Odds API dá no plano grátis (pedido por liga).
const API_MARKETS=['ft','ou','hcp'];
const apiSupports=mid=>API_MARKETS.includes(mid);
const CUR=new Map(CURATED.map(([id,c,cc,n],i)=>[String(id),{c,cc,n,order:i}]));

/* ---------- dados de exemplo (modo demonstração) ---------- */
const DEMO_LEAGUES=[
 {id:'tur',c:'Turquia',cc:'TUR',n:'Süper Lig',t:['Galatasaray','Fenerbahçe','Beşiktaş','Trabzonspor','Başakşehir','Samsunspor','Göztepe','Kasımpaşa','Antalyaspor','Konyaspor']},
 {id:'por1',c:'Portugal',cc:'POR',n:'Primeira Liga',t:['Benfica','FC Porto','Sporting CP','SC Braga','Vitória SC','Famalicão','Gil Vicente','Santa Clara','Estoril','Moreirense','Rio Ave','Arouca','Casa Pia','Nacional','Estrela da Amadora','Alverca','Tondela','AVS']},
 {id:'por2',c:'Portugal',cc:'POR',n:'Segunda Liga',t:['Académico de Viseu','Marítimo','Vizela','Chaves','Torreense','Portimonense','Leixões','Feirense','Penafiel','Oliveirense','Felgueiras','Benfica B']},
 {id:'epl',c:'Inglaterra',cc:'ENG',n:'Premier League',t:['Arsenal','Liverpool','Manchester City','Chelsea','Manchester United','Tottenham','Newcastle','Aston Villa','Brighton','Nottingham Forest','Brentford','Bournemouth','Crystal Palace','Everton','Fulham','West Ham']},
 {id:'esp',c:'Espanha',cc:'ESP',n:'La Liga',t:['Real Madrid','Barcelona','Atlético Madrid','Athletic Club','Villarreal','Real Betis','Real Sociedad','Sevilla','Valencia','Celta','Girona','Osasuna']},
 {id:'ita',c:'Itália',cc:'ITA',n:'Serie A',t:['Inter','Napoli','Juventus','Milan','Atalanta','Roma','Lazio','Fiorentina','Bologna','Como','Torino','Udinese']},
 {id:'ger1',c:'Alemanha',cc:'GER',n:'Bundesliga',t:['Bayern München','Borussia Dortmund','Bayer Leverkusen','RB Leipzig','Stuttgart','Eintracht Frankfurt','Freiburg','Hoffenheim','Wolfsburg','Mainz','Gladbach','Werder Bremen']},
 {id:'fra',c:'França',cc:'FRA',n:'Ligue 1',t:['PSG','Marseille','Monaco','Lille','Lyon','Nice','Lens','Rennes','Strasbourg','Toulouse','Nantes','Brest']},
 {id:'ned',c:'Países Baixos',cc:'NED',n:'Eredivisie',t:['PSV','Ajax','Feyenoord','AZ','Twente','Utrecht','NEC','Go Ahead Eagles','Heerenveen','Sparta Rotterdam']}
];
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DEMO_TIMES=['12:30','14:00','15:00','16:30','17:30','18:00','19:00','19:45','20:15','20:45'];
const demoCache={};
function demoFixtures(date,lg){
  const k=date+lg.id; if(demoCache[k])return demoCache[k];
  const r=rng(hash(k)),out=[];
  if(r()>0.35){
    const n=1+Math.floor(r()*Math.min(Math.floor(lg.t.length/2),6));
    const idx=shuffle(lg.t.map((_,i)=>i),r);
    for(let i=0;i<n;i++){
      const h=idx[2*i],a=idx[2*i+1],sh=1-h/lg.t.length*.6,sa=1-a/lg.t.length*.6;
      out.push({id:k+'-'+i,demo:true,lg,home:lg.t[h],away:lg.t[a],time:DEMO_TIMES[Math.floor(r()*DEMO_TIMES.length)],
        lh:Math.min(3.4,Math.max(.35,1.45*Math.pow(sh/sa,1.1))),la:Math.min(3.2,Math.max(.3,1.12*Math.pow(sa/sh,1.1))),corners:8.6+r()*2.8});
    }
    out.sort((x,y)=>x.time.localeCompare(y.time));
  }
  return demoCache[k]=out;
}
const fact=[1];for(let i=1;i<25;i++)fact[i]=fact[i-1]*i;
const pois=(l,k)=>Math.exp(-l)*Math.pow(l,k)/fact[k];
const over=(l,line)=>{let c=0;for(let k=0;k<=Math.floor(line);k++)c+=pois(l,k);return 1-c};
function matrix(lh,la){const m=[];for(let i=0;i<=10;i++){m[i]=[];for(let j=0;j<=10;j++)m[i][j]=pois(lh,i)*pois(la,j)}return m}
function sumM(m,f){let s=0;for(let i=0;i<=10;i++)for(let j=0;j<=10;j++)if(f(i,j))s+=m[i][j];return s}
function res(m){return{h:sumM(m,(i,j)=>i>j),d:sumM(m,(i,j)=>i===j),a:sumM(m,(i,j)=>i<j)}}
const ouP=(l,lines,pre='')=>lines.flatMap(x=>[{pick:`${pre}Mais de ${x}`,p:over(l,x)},{pick:`${pre}Menos de ${x}`,p:1-over(l,x)}]);
const hcpP=(m,f,lines)=>lines.flatMap(x=>[{pick:`${f.home} ${x>0?'+':''}${x}`,p:sumM(m,(i,j)=>i-j+x>0)},{pick:`${f.away} ${-x>0?'+':''}${-x}`,p:sumM(m,(i,j)=>j-i-x>0)}]);
const DEMO_MODEL={
 ft:(f,M)=>{const r=res(M.ft);return[{pick:f.home,p:r.h},{pick:'Empate',p:r.d},{pick:f.away,p:r.a}]},
 ht:(f,M)=>{const r=res(M.h1);return[{pick:f.home,p:r.h},{pick:'Empate',p:r.d},{pick:f.away,p:r.a}]},
 dc:(f,M)=>{const r=res(M.ft);return[{pick:`${f.home} ou Empate`,p:r.h+r.d},{pick:`${f.home} ou ${f.away}`,p:r.h+r.a},{pick:`Empate ou ${f.away}`,p:r.d+r.a}]},
 dnb:(f,M)=>{const r=res(M.ft);return[{pick:f.home,p:r.h/(r.h+r.a)},{pick:f.away,p:r.a/(r.h+r.a)}]},
 wbh:(f,M)=>{const a=res(M.h1),b=res(M.h2);return[{pick:f.home,p:a.h*b.h},{pick:f.away,p:a.a*b.a}]},
 btts:f=>{const p=(1-Math.exp(-f.lh))*(1-Math.exp(-f.la));return[{pick:'Sim',p},{pick:'Não',p:1-p}]},
 btts1:f=>{const p=(1-Math.exp(-f.lh*.45))*(1-Math.exp(-f.la*.45));return[{pick:'Sim',p},{pick:'Não',p:1-p}]},
 ou:f=>ouP(f.lh+f.la,[.5,1.5,2.5,3.5,4.5]),
 ou1:f=>ouP((f.lh+f.la)*.45,[.5,1.5,2.5]),
 ou2:f=>ouP((f.lh+f.la)*.55,[.5,1.5,2.5]),
 tgh:f=>ouP(f.lh,[.5,1.5,2.5],f.home+': '),
 tga:f=>ouP(f.la,[.5,1.5,2.5],f.away+': '),
 hcp:(f,M)=>hcpP(M.ft,f,[-1.5,-2.5]),
 hcp1:(f,M)=>hcpP(M.h1,f,[-.5,-1.5]),
 hcp2:(f,M)=>hcpP(M.h2,f,[-.5,-1.5]),
 cor:f=>ouP(f.corners,[7.5,8.5,9.5,10.5,11.5],'Cantos: '),
 sot:f=>ouP(2.6*(f.lh+f.la)+1.4,[5.5,6.5,7.5,8.5,9.5,10.5],'Remates à baliza: '),
 soth:f=>ouP(2.6*f.lh+.8,[2.5,3.5,4.5,5.5],f.home+': '),
 sota:f=>ouP(2.6*f.la+.7,[2.5,3.5,4.5,5.5],f.away+': ')
};
function demoSelections(f,mid){
  f._M??={ft:matrix(f.lh,f.la),h1:matrix(f.lh*.45,f.la*.45),h2:matrix(f.lh*.55,f.la*.55)};
  return DEMO_MODEL[mid](f,f._M).filter(s=>s.p>.03&&s.p<.985).map(s=>({pick:s.pick,odd:Math.max(1.01,Math.round(100/(s.p*1.065))/100),book:'Exemplo'}));
}

/* ---------- mercados ---------- */
const MARKETS=[
 ['ft','Resultado','Resultado Final'],['ht','Resultado','Resultado na Primeira Parte'],['dc','Resultado','Dupla Possibilidade'],
 ['dnb','Resultado','Resultado sem empate'],['wbh','Resultado','Vencedor das duas partes'],
 ['btts','Golos','Ambas as Equipas Marcam'],['btts1','Golos','Ambas marcam na primeira parte'],['ou','Golos','Mais/Menos Golos'],
 ['ou1','Golos','Mais/Menos Golos na Primeira Parte'],['ou2','Golos','Mais/Menos Golos na Segunda Parte'],
 ['tgh','Golos','Total de golos - Equipa da Casa'],['tga','Golos','Total de golos - Equipa Visitante'],
 ['hcp','Handicap','Handicap'],['hcp1','Handicap','Handicap 1ª parte'],['hcp2','Handicap','Handicap 2ª parte'],
 ['cor','Estatísticas','Total de cantos'],['sot','Estatísticas','Total de remates à baliza'],
 ['soth','Estatísticas','Equipa casa remates à baliza'],['sota','Estatísticas','Equipa visitante remates à baliza']
].map(([id,g,n])=>({id,g,n}));
const MK=Object.fromEntries(MARKETS.map(m=>[m.id,m]));
const PREFIX={tgh:f=>f.home+': ',tga:f=>f.away+': ',soth:f=>f.home+': ',sota:f=>f.away+': ',cor:()=>'Cantos: ',sot:()=>'Remates à baliza: '};

// Traduz um valor da API ("Home", "Over 2.5", "Home/Draw", "Away -1.5"...) para português.
function translate(mid,s,f){
  let v=s.v.trim();const team=t=>t==='Home'?f.home:t==='Away'?f.away:t;
  const simple={Home:f.home,Away:f.away,Draw:'Empate',Yes:'Sim',No:'Não','Home/Draw':`${f.home} ou Empate`,'Home/Away':`${f.home} ou ${f.away}`,'Draw/Away':`Empate ou ${f.away}`,'1':f.home,'X':'Empate','2':f.away};
  let out;
  if(/^(Over|Under)\b/i.test(v)){
    const line=v.replace(/^(Over|Under)\s*/i,'')||s.h||'';
    out=(/^over/i.test(v)?'Mais de ':'Menos de ')+line;
  }else{
    const m=v.match(/^(Home|Away)\s*([+-]?\d+(?:\.\d+)?)$/);
    if(m)out=`${team(m[1])} ${m[2].startsWith('-')||m[2].startsWith('+')?m[2]:(Number(m[2])>0?'+':'')+m[2]}`;
    else if(simple[v]!==undefined){out=simple[v];if(s.h!=null&&/^hcp/.test(mid))out+=` ${Number(s.h)>0?'+':''}${s.h}`}
    else out=v.replace(/\bHome\b/g,f.home).replace(/\bAway\b/g,f.away).replace(/\bDraw\b/g,'Empate');
  }
  return (PREFIX[mid]?PREFIX[mid](f):'')+out;
}

/* ---------- estado ---------- */
const store={get(k,d){try{const v=localStorage.getItem('combina.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('combina.'+k,JSON.stringify(v))}catch(e){}}};
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()+i*864e5);const o={timeZone:TZ};
  return{key:ymd(d),wd:i===0?'Hoje':i===1?'Amanhã':d.toLocaleDateString('pt-PT',{...o,weekday:'short'}).replace('.',''),
    dd:d.toLocaleDateString('pt-PT',{...o,day:'2-digit'}),
    long:i===0?'Hoje':i===1?'Amanhã':d.toLocaleDateString('pt-PT',{...o,weekday:'long',day:'numeric',month:'short'}).replace('.','')}});
const PRESETS=[{n:'Seguras',min:1.1,max:1.5},{n:'Equilibradas',min:1.5,max:2.5},{n:'Arriscadas',min:2.5,max:10}];
const S={target:{on:false,value:3,tol:.1},tab:'gerar',source:'loading',notice:'',day:days[0].key,games:2,leagues:new Set(),types:[],ranges:{},results:[],err:'',busy:false,
  showAll:false,dayData:{},oddsState:{},oddsHave:{},mk:{},quota:null,
  saved:store.get('saved',[]),stake:store.get('stake',5),perRun:store.get('perRun',3)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const dayLong=k=>days.find(d=>d.key===k)?.long??k;
const isDemo=()=>S.source==='demo';

/* ---------- servidor ---------- */
async function api(path){
  const r=await fetch(path,{headers:{Accept:'application/json'}});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j){const e=new Error(j?.error||'O servidor não respondeu.');e.code=j?.code||'no_server';throw e}
  return j;
}
async function ensureDay(date,force){
  const d=S.dayData[date];
  if(isDemo()||d?.status==='loading')return;
  if(!force&&d?.status==='ok'&&(d.all||!S.showAll))return;
  S.dayData[date]={status:'loading'};render();
  const all=S.showAll;
  try{const j=await api(`/api/events?date=${date}${all?'&all=1':''}`);S.dayData[date]={status:'ok',all,fixtures:j.fixtures}}
  catch(e){S.dayData[date]={status:'error',err:e.message}}
  render();
}
// Pede só os mercados que ainda não estão carregados para cada liga (cada mercado gasta créditos).
async function ensureOdds(date,leagueIds,mids=['ft']){
  mids=[...new Set(mids.filter(apiSupports))].sort();if(!mids.length)return;
  for(const id of leagueIds){
    const key=date+'|'+id;const have=S.oddsHave[key]||new Set();
    const need=mids.filter(m=>!have.has(m));if(!need.length)continue;
    if(!leaguesFor(date).some(l=>l.id===id))continue;
    S.oddsState[key]='loading';
    try{const j=await api(`/api/odds?date=${date}&league=${id}&markets=${need.join(',')}`);
      for(const f of j.fixtures)S.mk[f.id]={...(S.mk[f.id]||{}),...f.markets};
      need.forEach(m=>have.add(m));S.oddsHave[key]=have;S.oddsState[key]='ok';
      if(j.quota&&j.quota.remaining!=null)S.quota={remaining:j.quota.remaining,used:j.quota.used,total:j.quota.remaining+(j.quota.used||0)}}
    catch(e){S.oddsState[key]='error';throw e}
  }
}

/* ---------- consultas ---------- */
function leaguesFor(date){
  if(isDemo())return DEMO_LEAGUES.map(l=>({...l,count:demoFixtures(date,l).length,curated:true}));
  const fx=S.dayData[date]?.fixtures||[];const map=new Map();
  for(const f of fx){const id=String(f.league.id);let l=map.get(id);
    if(!l){const c=CUR.get(id);l={id,n:c?.n||f.league.name,c:c?.c||f.league.country,cc:c?.cc||(f.league.country||'').slice(0,3).toUpperCase(),season:f.league.season,curated:!!c,order:c?.order??999,count:0};map.set(id,l)}
    l.count++}
  return[...map.values()].sort((a,b)=>a.order-b.order||a.c.localeCompare(b.c)||a.n.localeCompare(b.n));
}
function fixturesFor(date,ids){
  if(isDemo())return DEMO_LEAGUES.filter(l=>!ids||ids.has(l.id)).flatMap(l=>demoFixtures(date,l));
  const L=new Map(leaguesFor(date).map(l=>[l.id,l]));
  return(S.dayData[date]?.fixtures||[]).filter(f=>!ids||ids.has(String(f.league.id)))
    .map(f=>({id:f.id,lg:L.get(String(f.league.id)),home:f.home,away:f.away,time:hhmm(f.ts),ts:f.ts}));
}
function selections(f,mid){
  if(f.demo)return demoSelections(f,mid);
  const m=S.mk[f.id]?.[mid];if(!m)return[];
  return m.sel.map(s=>({pick:translate(mid,s,f),odd:s.o,book:m.book}));
}
const selectedLeagues=()=>leaguesFor(S.day).filter(l=>S.leagues.has(l.id));

/* ---------- geração ---------- */
const rangeOf=mid=>S.ranges[mid]??{min:1.1,max:10};
// Seleções possíveis de um jogo: todos os tipos escolhidos, dentro do intervalo de cada um.
function candidates(f){
  const out=[];
  for(const mid of S.types){const {min,max}=rangeOf(mid);
    for(const s of selections(f,mid))if(s.odd>=min&&s.odd<=max)out.push({...s,mid})}
  return out;
}
const legOf=(f,s)=>({fx:f.id,league:f.lg.n,country:f.lg.c,time:f.time,match:`${f.home} vs ${f.away}`,market:MK[s.mid].n,pick:s.pick,odd:s.odd,book:s.book});
function makeMulti(legs){
  const sig=legs.map(l=>l.fx+l.pick).sort().join('|');
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),day:S.day,legs,total:legs.reduce((a,l)=>a*l.odd,1),stake:S.stake,sig};
}
const targetRange=()=>({lo:S.target.value*(1-S.target.tol),hi:S.target.value*(1+S.target.tol)});
// Limites da odd total possível com estes jogos e intervalos.
function oddBounds(cands){
  const mins=cands.map(c=>Math.min(...c.sel.map(s=>s.odd))).sort((a,b)=>a-b);
  const maxs=cands.map(c=>Math.max(...c.sel.map(s=>s.odd))).sort((a,b)=>b-a);
  const prod=a=>a.slice(0,S.games).reduce((x,y)=>x*y,1);
  return{min:prod(mins),max:prod(maxs)};
}
// Gera uma multi que ainda não esteja em `taken`. Com odd alvo, procura combinações dentro da margem.
// Devolve {multi} ou {best} (a combinação mais próxima do alvo, para a mensagem de erro).
function buildMulti(fixtures,taken){
  const cands=shuffle(fixtures).map(f=>({f,sel:candidates(f)})).filter(c=>c.sel.length);
  if(cands.length<S.games)return{};
  if(!S.target.on){
    for(let attempt=0;attempt<40;attempt++){
      const legs=shuffle(cands).slice(0,S.games).map(c=>{
        const mid=shuffle([...new Set(c.sel.map(s=>s.mid))])[0];const ss=c.sel.filter(s=>s.mid===mid);
        return legOf(c.f,ss[Math.floor(Math.random()*ss.length)])});
      const m=makeMulti(legs);if(!taken.has(m.sig)){taken.add(m.sig);return{multi:m}}
    }
    return{};
  }
  const T=Math.log(S.target.value),{lo,hi}=targetRange();
  let best=null;
  for(let attempt=0;attempt<2500;attempt++){
    const pick=shuffle(cands).slice(0,S.games);
    // Escolhe cada seleção perto da odd que falta repartir pelos jogos restantes, com alguma variedade.
    let acc=0;const chosen=[];
    pick.forEach((c,i)=>{
      const ideal=(T-acc)/(pick.length-i);
      const ranked=c.sel.map(s=>({s,d:Math.abs(Math.log(s.odd)-ideal)})).sort((a,b)=>a.d-b.d);
      const s=ranked[Math.floor(Math.random()*Math.min(3,ranked.length))].s;
      chosen.push(s);acc+=Math.log(s.odd);
    });
    // Afinação: troca uma seleção de cada vez pela que aproxima mais o total do alvo.
    for(let pass=0;pass<2;pass++)pick.forEach((c,i)=>{
      const rest=acc-Math.log(chosen[i].odd);
      const s=c.sel.reduce((b,x)=>Math.abs(rest+Math.log(x.odd)-T)<Math.abs(rest+Math.log(b.odd)-T)?x:b,chosen[i]);
      if(Math.random()<.7){acc=rest+Math.log(s.odd);chosen[i]=s}
    });
    const total=Math.exp(acc);
    if(!best||Math.abs(acc-T)<Math.abs(Math.log(best)-T))best=total;
    if(total<lo||total>hi)continue;
    const m=makeMulti(pick.map((c,i)=>legOf(c.f,chosen[i])));
    if(!taken.has(m.sig)){taken.add(m.sig);return{multi:m}}
  }
  return{best,bounds:oddBounds(cands)};
}
function noMultiMessage(p,r){
  const n=p.filter(f=>candidates(f).length).length;
  if(n<S.games)return n?`Só ${n} ${n===1?'jogo tem':'jogos têm'} odds dentro dos intervalos escolhidos. Alarga os intervalos, junta ligas ou baixa o número de jogos.`:'Nenhum jogo tem odds dentro dos intervalos escolhidos. Alarga os intervalos ou junta tipos de aposta.';
  if(S.target.on&&r.bounds){const{lo,hi}=targetRange(),b=r.bounds;
    if(b.max<lo)return`Com ${S.games} jogos e estes intervalos, a odd total vai no máximo até ${fmt(b.max)}. Junta jogos, sobe os máximos ou baixa o alvo.`;
    if(b.min>hi)return`Com ${S.games} jogos e estes intervalos, a odd total nunca fica abaixo de ${fmt(b.min)}. Tira jogos, baixa os mínimos ou sobe o alvo.`;
    return`Não encontrei uma multi entre ${fmt(lo)} e ${fmt(hi)}. O mais perto foi ${fmt(r.best)}. Alarga a margem ou junta tipos de aposta.`}
  return'Nenhuma combinação cabe nos intervalos de odds escolhidos. Alarga os intervalos ou junta tipos de aposta.';
}
function pool(){return fixturesFor(S.day,new Set(selectedLeagues().map(l=>l.id)))}
async function generate(scroll=true){
  if(S.busy)return;
  S.err='';S.results=[];
  const sel=selectedLeagues();
  if(!sel.length){S.err='Escolhe pelo menos uma liga com jogos neste dia.';return render()}
  if(!S.types.length){S.err='Escolhe pelo menos um tipo de aposta.';return render()}
  if(!isDemo()&&!S.types.some(apiSupports)){S.err='Com a API grátis só há odds de Resultado Final, Mais/Menos Golos e Handicap. Escolhe pelo menos um destes.';return render()}
  for(const mid of S.types){const r=rangeOf(mid);if(!(r.min>=1.01&&r.max>=r.min)){S.err=`O intervalo de odds de "${MK[mid].n}" não é válido.`;return render()}}
  let p=pool();
  if(p.length<S.games){S.err=`Só há ${p.length} ${p.length===1?'jogo':'jogos'} nas ligas escolhidas para ${dayLong(S.day).toLowerCase()}. Junta mais ligas ou baixa o número de jogos.`;return render()}
  if(!isDemo()){
    S.busy=true;render();
    try{await ensureOdds(S.day,sel.map(l=>l.id),S.types)}
    catch(e){S.busy=false;S.err=`Não consegui carregar as odds: ${e.message}`;return render()}
    S.busy=false;
    p=p.filter(f=>S.mk[f.id]&&Object.keys(S.mk[f.id]).length);
    if(!p.length){S.err='Ainda não há odds para estes jogos. As casas de apostas costumam publicá-las uns dias antes do jogo.';return render()}
    const withType=p.filter(f=>S.types.some(mid=>S.mk[f.id][mid]));
    if(!withType.length){S.err='Nenhum destes jogos tem odds para os tipos de aposta escolhidos. Experimenta outros tipos.';return render()}
  }
  if(S.target.on&&!(S.target.value>=1.01)){S.err='Escreve uma odd total válida (maior que 1).';return render()}
  const taken=new Set();let last={};
  for(let i=0;i<S.perRun;i++){last=buildMulti(p,taken);if(last.multi)S.results.push(last.multi)}
  if(!S.results.length)S.err=noMultiMessage(p,last);
  else if(S.target.on&&S.results.length<S.perRun)S.err=`Só encontrei ${S.results.length} ${S.results.length===1?'combinação diferente':'combinações diferentes'} perto de ${fmt(S.target.value)}. Alarga a margem para veres mais.`;
  render();
  if(scroll)document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'});
}

  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;S.confirmDel=false;render();window.scrollTo(0,0);if(d.tab==='perfil'&&!isDemo())loadQuota();return}
  if(d.day){setDay(d.day);return}
  if('retryday' in d){delete S.dayData[S.day];ensureDay(S.day);return}
  if(d.per){S.perRun=Math.min(5,Math.max(1,S.perRun+ +d.per));store.set('perRun',S.perRun);render();return}
  if(d.open){openSheet(d.open);return}
  if('close' in d){closeSheet();return}
  if(d.q){
    if(d.q==='all')leaguesFor(S.day).forEach(l=>{if(l.curated)draft.add(l.id)});
    else if(d.q==='none')draft.clear();
    else{S.showAll=!S.showAll;ensureDay(S.day)}
    drawList();return}
  if('confirm' in d){
    if(document.getElementById('sheet').dataset.kind==='leagues')S.leagues=draft;
    else{S.types=draft;for(const k of Object.keys(S.ranges))if(!S.types.includes(k))delete S.ranges[k]}
    closeSheet();S.err='';render();return}
  if(d.unlg){S.leagues.delete(d.unlg);render();return}
  if(d.unmk){S.types=S.types.filter(x=>x!==d.unmk);delete S.ranges[d.unmk];render();return}
  if(d.preset){const[mid,pi]=d.preset.split(':');const p=PRESETS[+pi];S.ranges[mid]={min:p.min,max:p.max};render();return}
  if(d.loadodds){const id=d.loadodds;const p=ensureOdds(S.day,[id],['ft']);render();try{await p}catch(err){S.err=err.message}render();return}
  if(d.act==='toggleall'){S.showAll=!S.showAll;render();ensureDay(S.day);return}
  if(d.act==='gen'){generate();return}
  if(d.act==='target'){S.target.on=!S.target.on;S.err='';render();if(S.target.on)document.getElementById('tval')?.focus();return}
  if(d.tol){S.target.tol=+d.tol;render();return}
  if(d.act==='clear'){S.target={on:false,value:3,tol:.1};S.games=2;S.leagues=new Set();S.types=[];S.ranges={};S.results=[];S.err='';render();if(S.day!==days[0].key)setDay(days[0].key);window.scrollTo({top:0,behavior:'smooth'});return}
  if(d.act==='source'){S.source=isDemo()?'api':'demo';if(!isDemo())S.types=S.types.filter(apiSupports);S.notice='';S.leagues=new Set();S.results=[];S.err='';render();ensureDay(S.day);if(!isDemo())loadQuota();return}
  if(d.act==='delask'){S.confirmDel=true;render();return}
  if(d.act==='delno'){S.confirmDel=false;render();return}
  if(d.act==='delyes'){S.saved=[];store.set('saved',[]);S.confirmDel=false;render();return}
  if(d.reroll!==undefined){
    const i=+d.reroll;const p=pool().filter(f=>f.demo||S.mk[f.id]);
    const taken=new Set(S.results.map(m=>m.sig));const m=buildMulti(p,taken).multi;
    if(m){S.results[i]=m;S.err=''}else S.err='Não encontrei outra combinação diferente com estes filtros.';render();return}
  if(d.save){
    const m=S.results.find(x=>x.id===d.save);if(!m)return;
    const idx=S.saved.findIndex(s=>s.id===m.id);
    if(idx>=0)S.saved.splice(idx,1);else S.saved.unshift(m);
    store.set('saved',S.saved);render();return}
  if(d.remove){S.saved=S.saved.filter(s=>s.id!==d.remove);store.set('saved',S.saved);render();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.lg){t.checked?draft.add(t.dataset.lg):draft.delete(t.dataset.lg);drawList();return}
  if(t.dataset.mk){const id=t.dataset.mk;if(t.checked&&!draft.includes(id)&&draft.length<6)draft.push(id);else if(!t.checked)draft=draft.filter(x=>x!==id);drawList();return}
  if(t.id==='games'){render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){drawList();return}
  if(t.id==='tval'){S.target.value=parseFloat(String(t.value).replace(',','.'));const r=document.getElementById('trange');
    if(r)r.innerHTML=S.target.value>=1.01?`Bilhetes entre <b class="num">${fmt(targetRange().lo)}</b> e <b class="num">${fmt(targetRange().hi)}</b>. Cada jogo continua dentro do intervalo do seu mercado.`:'Escreve uma odd maior que 1.';return}
  if(t.id==='games'){S.games=+t.value;document.getElementById('gamesOut').textContent=S.games;return}
  if(t.dataset.range){const r={...rangeOf(t.dataset.range)};r[t.dataset.k]=parseFloat(String(t.value).replace(',','.'));S.ranges[t.dataset.range]=r;
    t.closest('.orow').querySelectorAll('[data-preset]').forEach(b=>{const p=PRESETS[+b.dataset.preset.split(':')[1]];b.setAttribute('aria-pressed',r.min===p.min&&r.max===p.max)});return}
  if(t.dataset.stake){
    const v=Math.max(0,parseFloat(t.value)||0);const m=S.results.find(x=>x.id===t.dataset.stake)||S.saved.find(x=>x.id===t.dataset.stake);
    if(m){m.stake=v;const out=document.querySelector(`[data-ret="${m.id}"]`);if(out)out.textContent=fmt(v*m.total)+' €';const s=S.saved.find(x=>x.id===m.id);if(s){s.stake=v;store.set('saved',S.saved)}}return}
  if(t.id==='defstake'){S.stake=Math.max(0,parseFloat(t.value)||0);store.set('stake',S.stake)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheet').hidden)closeSheet()});

/* ---------- arranque ---------- */
(async function start(){
  render();
  try{
    const j=await api(`/api/events?date=${S.day}`);
    S.source='api';S.apiOk=true;S.dayData[S.day]={status:'ok',fixtures:j.fixtures};
    const want=['soccer_portugal_primeira_liga','soccer_epl','soccer_spain_la_liga'].filter(id=>leaguesFor(S.day).some(l=>l.id===id));
    S.leagues=new Set(want);S.types=['ft','ou'];S.ranges={ft:{min:1.5,max:2.5},ou:{min:1.5,max:2.5}};
    render();
  }catch(e){
    if(e.code&&!['missing_key','no_server'].includes(e.code)){
      // O servidor está a funcionar mas a API recusou: mostra o erro em vez de esconder.
      S.source='api';S.apiOk=true;S.dayData[S.day]={status:'error',err:e.message};render();return;
    }
    S.source='demo';S.apiOk=false;
    S.notice=e.code==='missing_key'?'Falta configurar a chave da The Odds API. Até lá, estás a ver dados de exemplo.':'Sem ligação ao servidor. Estás a ver dados de exemplo.';
    S.leagues=new Set(['por1','epl','esp']);S.types=['ft','dc','ou'];S.ranges={ft:{min:1.5,max:2.5},dc:{min:1.1,max:1.5},ou:{min:1.5,max:2.5}};
    await generate(false);
  }
})();

</script>
