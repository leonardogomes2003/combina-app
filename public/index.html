<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Combina</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#060b1a">
<meta name="description" content="Gera multis de futebol com as ligas, os mercados e as odds que escolhes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app escura de uma coluna. Barra superior fixa, faixa de dias, um painel único de definições,
   bilhetes em baixo, botão de gerar flutuante e navegação fixa em baixo. Folhas sobem do fundo. */
:root{
  --bg:#060b1a; --bg2:#0a1328; --card:#0e1937; --card2:#14224a; --card3:#1b2d5e;
  --line:rgba(150,178,255,.11); --line2:rgba(150,178,255,.22);
  --fg:#f1f5ff; --muted:#93a3cc; --dim:#6474a0;
  --blue:#3d7dff; --blue2:#86adff; --glow:rgba(61,125,255,.35);
  --good:#3ddc97; --good-bg:rgba(61,220,151,.12); --bad:#ff7a7a; --bad-bg:rgba(255,122,122,.12); --warn:#ffcf5c;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(90% 50% at 85% -10%,rgba(61,125,255,.22),transparent 70%),radial-gradient(60% 40% at -10% 10%,rgba(61,125,255,.08),transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,11,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.logo svg{width:26px;height:26px}
.src{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:5px 10px}
.src i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.src.demo i{background:var(--warn);box-shadow:0 0 0 3px rgba(255,207,92,.15)}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(180px + env(safe-area-inset-bottom,0px))}
main.nogen{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:900;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin:4px 0 16px;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}

/* dias */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 14px calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px))}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:62px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;display:grid;justify-items:center}
.day small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day strong{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05}
.day em{font-style:normal;font-size:11px;color:var(--dim);font-weight:600;min-height:1.2em}
.day[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);box-shadow:0 8px 24px var(--glow)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:rgba(255,255,255,.85)}

/* painel de definições */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--blue2)}
.ico svg{width:18px;height:18px}
.panel .ico{font-family:var(--display);font-weight:800;font-size:18px}
.panel .ico.ok{background:var(--blue);color:#fff}
.todo{color:var(--blue2);font-weight:600}
.opt{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;font-size:15px}
.rt span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{display:flex;align-items:center;gap:6px;color:var(--fg);font-weight:600;flex:none}
.rv svg{color:var(--dim)}
.stepper{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;flex:none}
.stepper button{width:36px;height:36px;border:0;background:none;font-size:20px;font-weight:600;color:var(--blue2)}
.stepper output{min-width:26px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px}
.critrow{border-top:1px solid var(--line);padding-top:12px}
.critrow .lbl{padding:0 16px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;margin:0 16px 4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card3);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg-note{margin:0;padding:6px 16px 14px;color:var(--muted);font-size:13px}

.alert{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(255,122,122,.25);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;margin:14px 0 0}
.notice{background:rgba(255,207,92,.1);color:var(--warn);border:1px solid rgba(255,207,92,.25);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.hint{color:var(--muted);font-size:14px;margin:0 2px 14px}
.link{border:0;background:none;padding:0;color:inherit;font-weight:700;text-decoration:underline}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;vertical-align:-2px;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* bilhetes */
.res-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.res-h h2{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;margin:0;letter-spacing:.01em}
.res-h span{color:var(--muted);font-size:13px}
.tks{display:grid;gap:14px}
.tk{background:linear-gradient(180deg,var(--card2),var(--card) 140px);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tk-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.tk-h small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk-h .t{font-weight:600}
.tk-odd{text-align:right}
.tk-odd .big{font-size:44px;line-height:.9}
.tk-stats{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.chip b{color:var(--fg);font-weight:600}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.good b{color:var(--good)}
.bar{height:3px;background:var(--bg2);margin:0 18px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:3px}
.legs{list-style:none;margin:6px 0 0;padding:0 18px}
.leg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.leg:first-child{border-top:0}
.leg time{grid-row:1/3;align-self:start;font-size:13px;font-weight:600;color:var(--blue2);padding-top:1px}
.leg .m{font-weight:600;line-height:1.3}
.leg .p{grid-column:2;color:var(--muted);font-size:14px}
.leg .p strong{color:var(--fg);font-weight:600}
.leg .c{grid-column:2/4;font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.leg .c .good{color:var(--good);font-weight:600}
.leg .o{grid-row:1/3;grid-column:3;font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.tk-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.12)}
.stake{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 10px;color:var(--muted);font-weight:600}
.stake input{width:56px;border:0;background:none;padding:9px 0;font-size:15px;font-variant-numeric:tabular-nums}
.stake input:focus{outline:none}
.stake:focus-within{border-color:var(--blue)}
.ret{font-size:12px;color:var(--muted);line-height:1.2}
.ret b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.acts{margin-left:auto;display:flex;gap:6px}
.btn{height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:0 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn svg{width:15px;height:15px}
.btn.on{background:var(--blue);border-color:var(--blue)}
.btn.warn{color:var(--bad)}

/* jogos */
.lg{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.lg-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.cc{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--card2);color:var(--blue2);border-radius:6px;padding:3px 6px;flex:none}
.lg-h b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.g time{font-size:13px;color:var(--blue2);font-weight:600}
.g .tm{font-weight:500;font-size:14px;line-height:1.4}
.g .tm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x3{display:flex;gap:4px}
.x3 span{min-width:50px;text-align:center;background:var(--bg2);border-radius:9px;padding:4px 5px 3px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.x3 em{display:block;font-style:normal;font-size:10px;color:var(--dim);font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin-bottom:4px}
.more{width:100%;margin-top:4px;border:1px dashed var(--line2);background:none;border-radius:16px;padding:12px;color:var(--blue2);font-weight:600}

/* ajustes */
.set select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:46vw;flex:none}
.note{color:var(--dim);font-size:13px;margin:14px 4px 0}
.explain{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;font-size:14px;color:var(--muted)}
.explain h3{margin:0 0 6px;color:var(--fg);font-size:15px}
.explain p{margin:0 0 8px;max-width:60ch}
.explain p:last-child{margin:0}
.explain b{color:var(--fg)}

/* barra de gerar e navegação */
.genbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.genbar-in{max-width:528px;margin:0 auto;pointer-events:auto}
.go{width:100%;border:0;border-radius:18px;padding:16px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.go svg{width:18px;height:18px}
.go:disabled{opacity:.85}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,11,26,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--dim);position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
nav.tabs button[aria-current="page"] svg{color:var(--blue)}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(2,5,14,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line2);border-bottom:0;width:100%;max-width:560px;max-height:88%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:10px auto 0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sh h2{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;margin:0}
.sh button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.sb{flex:1;overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px;color:var(--dim)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--blue)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.quick button,.pre button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--blue2)}
.pre button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow input,.tile input{position:absolute;opacity:0;pointer-events:none}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;font-weight:600}
.lrow .nm small{color:var(--muted);font-size:13px}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.lrow.on .box,.lrow input:checked~.box{background:var(--blue);border-color:var(--blue)}
.lrow.on .box::after,.lrow input:checked~.box::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lrow input:focus-visible~.box{outline:2px solid var(--blue2);outline-offset:2px}
.cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim);margin:16px 2px 8px}
.cat:first-of-type{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-size:14px;font-weight:600;line-height:1.3;cursor:pointer;display:block;min-height:54px}
.tile small{display:block;font-size:11px;font-weight:500;color:var(--dim);margin-top:4px}
.tile.on{border-color:var(--blue);background:rgba(61,125,255,.14)}
.tile.on::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tile:has(input:focus-visible){outline:2px solid var(--blue2);outline-offset:2px}
.tile.off{opacity:.4;cursor:default}
.orow{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:10px}
.orow h3{margin:0;font-size:14px;font-weight:600}
.oin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oin label,.tv{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.oin input{width:0;flex:1;min-width:0;border:0;background:none;padding:10px 0;font-size:17px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.oin input:focus,.tv input:focus{outline:none}
.oin label:focus-within,.tv:focus-within{border-color:var(--blue)}
.pre{display:flex;gap:6px;flex-wrap:wrap}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.tgl b{font-weight:600}
.tgl small{display:block;color:var(--muted);font-size:13px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--card3);position:relative;padding:0;flex:none;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.tv{text-transform:none;letter-spacing:0;font-size:14px;margin-bottom:12px}
.tv input{width:0;flex:1;min-width:0;border:0;background:none;padding:6px 0;text-align:right;font-family:var(--display);font-weight:800;font-size:40px}
.sf{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sf .meta{font-size:13px;color:var(--muted);flex:1;min-width:0}
.sf .meta b{color:var(--fg)}
.sf .go{width:auto;padding:13px 26px;box-shadow:none;flex:none}
@media (prefers-reduced-motion:no-preference){
  .tk{animation:rise .3s ease-out both}
  .tk:nth-child(2){animation-delay:.05s}.tk:nth-child(3){animation-delay:.1s}
  .sheet{animation:up .22s ease-out}
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">

<script>
/* ================= Combina ================= */
const TZ='Europe/Lisbon';
const ymd=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
const hhmm=ts=>new Date(ts*1000).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',timeZone:TZ});

/* ---------- ligas em destaque (chaves da The Odds API) ---------- */
const CURATED=[
 ['soccer_portugal_primeira_liga','Portugal','POR','Primeira Liga'],
 ['soccer_uefa_champs_league','Europa','UEFA','Liga dos Campeões'],['soccer_uefa_europa_league','Europa','UEFA','Liga Europa'],['soccer_uefa_europa_conference_league','Europa','UEFA','Liga Conferência'],
 ['soccer_epl','Inglaterra','ENG','Premier League'],['soccer_fa_cup','Inglaterra','ENG','FA Cup'],['soccer_spain_la_liga','Espanha','ESP','La Liga'],
 ['soccer_italy_serie_a','Itália','ITA','Serie A'],['soccer_germany_bundesliga','Alemanha','GER','Bundesliga'],['soccer_germany_bundesliga2','Alemanha','GER','2. Bundesliga'],
 ['soccer_france_ligue_one','França','FRA','Ligue 1'],['soccer_netherlands_eredivisie','Países Baixos','NED','Eredivisie'],['soccer_belgium_first_div','Bélgica','BEL','Jupiler Pro League'],
 ['soccer_turkey_super_league','Turquia','TUR','Süper Lig'],['soccer_denmark_superliga','Dinamarca','DEN','Superliga'],['soccer_sweden_allsvenskan','Suécia','SWE','Allsvenskan'],
 ['soccer_switzerland_superleague','Suíça','SUI','Super League'],['soccer_austria_bundesliga','Áustria','AUT','Bundesliga'],['soccer_norway_eliteserien','Noruega','NOR','Eliteserien'],
 ['soccer_spl','Escócia','SCO','Premiership'],['soccer_brazil_campeonato','Brasil','BRA','Brasileirão']
];
const CUR=new Map(CURATED.map(([id,c,cc,n],i)=>[id,{c,cc,n,order:i}]));
// Mercados que a The Odds API dá no plano grátis (pedido por liga).
const API_MARKETS=['ft','ou','hcp'];
const apiSupports=mid=>API_MARKETS.includes(mid);

/* ---------- dados de exemplo (modo demonstração) ---------- */
const DEMO_LEAGUES=[
 {id:'por1',c:'Portugal',cc:'POR',n:'Primeira Liga',t:['Benfica','FC Porto','Sporting CP','SC Braga','Vitória SC','Famalicão','Gil Vicente','Santa Clara','Estoril','Moreirense','Rio Ave','Arouca','Casa Pia','Nacional','Estrela da Amadora','Alverca','Tondela','AVS']},
 {id:'epl',c:'Inglaterra',cc:'ENG',n:'Premier League',t:['Arsenal','Liverpool','Manchester City','Chelsea','Manchester United','Tottenham','Newcastle','Aston Villa','Brighton','Nottingham Forest','Brentford','Bournemouth','Crystal Palace','Everton','Fulham','West Ham']},
 {id:'esp',c:'Espanha',cc:'ESP',n:'La Liga',t:['Real Madrid','Barcelona','Atlético Madrid','Athletic Club','Villarreal','Real Betis','Real Sociedad','Sevilla','Valencia','Celta','Girona','Osasuna']},
 {id:'ita',c:'Itália',cc:'ITA',n:'Serie A',t:['Inter','Napoli','Juventus','Milan','Atalanta','Roma','Lazio','Fiorentina','Bologna','Como','Torino','Udinese']},
 {id:'ger1',c:'Alemanha',cc:'GER',n:'Bundesliga',t:['Bayern München','Borussia Dortmund','Bayer Leverkusen','RB Leipzig','Stuttgart','Eintracht Frankfurt','Freiburg','Hoffenheim','Wolfsburg','Mainz','Gladbach','Werder Bremen']},
 {id:'fra',c:'França',cc:'FRA',n:'Ligue 1',t:['PSG','Marseille','Monaco','Lille','Lyon','Nice','Lens','Rennes','Strasbourg','Toulouse','Nantes','Brest']},
 {id:'ned',c:'Países Baixos',cc:'NED',n:'Eredivisie',t:['PSV','Ajax','Feyenoord','AZ','Twente','Utrecht','NEC','Go Ahead Eagles','Heerenveen','Sparta Rotterdam']},
 {id:'tur',c:'Turquia',cc:'TUR',n:'Süper Lig',t:['Galatasaray','Fenerbahçe','Beşiktaş','Trabzonspor','Başakşehir','Samsunspor','Göztepe','Kasımpaşa','Antalyaspor','Konyaspor']}
];
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DEMO_TIMES=['12:30','14:00','15:00','16:30','17:30','18:00','19:00','19:45','20:15','20:45'];
const demoCache={};
function demoFixtures(date,lg){
  const k=date+lg.id; if(demoCache[k])return demoCache[k];
  const r=rng(hash(k)),out=[];
  if(r()>0.3){
    const n=1+Math.floor(r()*Math.min(Math.floor(lg.t.length/2),6));
    const idx=shuffle(lg.t.map((_,i)=>i),r);
    for(let i=0;i<n;i++){
      const h=idx[2*i],a=idx[2*i+1],sh=1-h/lg.t.length*.6,sa=1-a/lg.t.length*.6;
      out.push({id:k+'-'+i,demo:true,lg,home:lg.t[h],away:lg.t[a],time:DEMO_TIMES[Math.floor(r()*DEMO_TIMES.length)],
        lh:Math.min(3.4,Math.max(.35,1.45*Math.pow(sh/sa,1.1))),la:Math.min(3.2,Math.max(.3,1.12*Math.pow(sa/sh,1.1))),corners:8.6+r()*2.8});
    }
    out.sort((x,y)=>x.time.localeCompare(y.time));
  }
  return demoCache[k]=out;
}
const fact=[1];for(let i=1;i<25;i++)fact[i]=fact[i-1]*i;
const pois=(l,k)=>Math.exp(-l)*Math.pow(l,k)/fact[k];
const over=(l,line)=>{let c=0;for(let k=0;k<=Math.floor(line);k++)c+=pois(l,k);return 1-c};
function matrix(lh,la){const m=[];for(let i=0;i<=10;i++){m[i]=[];for(let j=0;j<=10;j++)m[i][j]=pois(lh,i)*pois(la,j)}return m}
function sumM(m,f){let s=0;for(let i=0;i<=10;i++)for(let j=0;j<=10;j++)if(f(i,j))s+=m[i][j];return s}
function res(m){return{h:sumM(m,(i,j)=>i>j),d:sumM(m,(i,j)=>i===j),a:sumM(m,(i,j)=>i<j)}}
const ouP=(l,lines,pre='')=>lines.flatMap(x=>[{pick:`${pre}Mais de ${String(x).replace('.',',')}`,p:over(l,x)},{pick:`${pre}Menos de ${String(x).replace('.',',')}`,p:1-over(l,x)}]);
const hcpP=(m,f,lines)=>lines.flatMap(x=>[{pick:`${f.home} ${x>0?'+':''}${String(x).replace('.',',')}`,p:sumM(m,(i,j)=>i-j+x>0)},{pick:`${f.away} ${-x>0?'+':''}${String(-x).replace('.',',')}`,p:sumM(m,(i,j)=>j-i-x>0)}]);
const DEMO_MODEL={
 ft:(f,M)=>{const r=res(M.ft);return[{pick:f.home,p:r.h},{pick:'Empate',p:r.d},{pick:f.away,p:r.a}]},
 ht:(f,M)=>{const r=res(M.h1);return[{pick:f.home,p:r.h},{pick:'Empate',p:r.d},{pick:f.away,p:r.a}]},
 dc:(f,M)=>{const r=res(M.ft);return[{pick:`${f.home} ou Empate`,p:r.h+r.d},{pick:`${f.home} ou ${f.away}`,p:r.h+r.a},{pick:`Empate ou ${f.away}`,p:r.d+r.a}]},
 dnb:(f,M)=>{const r=res(M.ft);return[{pick:f.home,p:r.h/(r.h+r.a)},{pick:f.away,p:r.a/(r.h+r.a)}]},
 wbh:(f,M)=>{const a=res(M.h1),b=res(M.h2);return[{pick:f.home,p:a.h*b.h},{pick:f.away,p:a.a*b.a}]},
 btts:f=>{const p=(1-Math.exp(-f.lh))*(1-Math.exp(-f.la));return[{pick:'Sim',p},{pick:'Não',p:1-p}]},
 btts1:f=>{const p=(1-Math.exp(-f.lh*.45))*(1-Math.exp(-f.la*.45));return[{pick:'Sim',p},{pick:'Não',p:1-p}]},
 ou:f=>ouP(f.lh+f.la,[.5,1.5,2.5,3.5,4.5]),
 ou1:f=>ouP((f.lh+f.la)*.45,[.5,1.5,2.5]),
 ou2:f=>ouP((f.lh+f.la)*.55,[.5,1.5,2.5]),
 tgh:f=>ouP(f.lh,[.5,1.5,2.5],f.home+': '),
 tga:f=>ouP(f.la,[.5,1.5,2.5],f.away+': '),
 hcp:(f,M)=>hcpP(M.ft,f,[-1.5,-2.5]),
 hcp1:(f,M)=>hcpP(M.h1,f,[-.5,-1.5]),
 hcp2:(f,M)=>hcpP(M.h2,f,[-.5,-1.5]),
 cor:f=>ouP(f.corners,[7.5,8.5,9.5,10.5,11.5],'Cantos: '),
 sot:f=>ouP(2.6*(f.lh+f.la)+1.4,[5.5,6.5,7.5,8.5,9.5,10.5],'Remates à baliza: '),
 soth:f=>ouP(2.6*f.lh+.8,[2.5,3.5,4.5,5.5],f.home+': '),
 sota:f=>ouP(2.6*f.la+.7,[2.5,3.5,4.5,5.5],f.away+': ')
};
// No modo de exemplo há três casas fictícias com margens e erros diferentes, para a análise ter o que comparar.
const DEMO_BOOKS=[['Casa Exemplo A',1.05],['Casa Exemplo B',1.07],['Casa Exemplo C',1.09]];
function demoSelections(f,mid){
  f._M??={ft:matrix(f.lh,f.la),h1:matrix(f.lh*.45,f.la*.45),h2:matrix(f.lh*.55,f.la*.55)};
  return DEMO_MODEL[mid](f,f._M).filter(s=>s.p>.03&&s.p<.97).map(s=>{
    const odds={};
    for(const[b,m]of DEMO_BOOKS){const noise=(rng(hash(f.id+s.pick+b))()-.5)*.12;odds[b]=Math.max(1.01,Math.round(100/(s.p*m)*(1+noise))/100)}
    return pickOdd({pick:s.pick,p:s.p,n:DEMO_BOOKS.length,src:'modelo',odds});
  }).filter(Boolean);
}

/* ---------- mercados ---------- */
const MARKETS=[
 ['ft','Resultado','Resultado Final'],['ht','Resultado','Resultado na Primeira Parte'],['dc','Resultado','Dupla Possibilidade'],
 ['dnb','Resultado','Resultado sem empate'],['wbh','Resultado','Vencedor das duas partes'],
 ['btts','Golos','Ambas as Equipas Marcam'],['btts1','Golos','Ambas marcam na primeira parte'],['ou','Golos','Mais/Menos Golos'],
 ['ou1','Golos','Mais/Menos Golos na Primeira Parte'],['ou2','Golos','Mais/Menos Golos na Segunda Parte'],
 ['tgh','Golos','Total de golos - Equipa da Casa'],['tga','Golos','Total de golos - Equipa Visitante'],
 ['hcp','Handicap','Handicap'],['hcp1','Handicap','Handicap 1ª parte'],['hcp2','Handicap','Handicap 2ª parte'],
 ['cor','Estatísticas','Total de cantos'],['sot','Estatísticas','Total de remates à baliza'],
 ['soth','Estatísticas','Equipa casa remates à baliza'],['sota','Estatísticas','Equipa visitante remates à baliza']
].map(([id,g,n])=>({id,g,n}));
const MK=Object.fromEntries(MARKETS.map(m=>[m.id,m]));
const SHORT={ft:'Resultado',ou:'Golos',hcp:'Handicap',dc:'Dupla',btts:'Ambas marcam'};
const PREFIX={tgh:f=>f.home+': ',tga:f=>f.away+': ',soth:f=>f.home+': ',sota:f=>f.away+': ',cor:()=>'Cantos: ',sot:()=>'Remates à baliza: '};

// Traduz um valor da API ("Home", "Over" + linha, "Away" + handicap) para português.
function translate(mid,s,f){
  const v=String(s.v).trim();let out;
  const simple={Home:f.home,Away:f.away,Draw:'Empate',Yes:'Sim',No:'Não'};
  const dec=x=>String(x).replace('.',',');
  if(/^(Over|Under)\b/i.test(v)){const line=v.replace(/^(Over|Under)\s*/i,'')||s.h||'';out=(/^over/i.test(v)?'Mais de ':'Menos de ')+dec(line)}
  else if(simple[v]!==undefined){out=simple[v];if(s.h!=null&&/^hcp/.test(mid))out+=` ${Number(s.h)>0?'+':''}${dec(s.h)}`}
  else out=v.replace(/\bHome\b/g,f.home).replace(/\bAway\b/g,f.away).replace(/\bDraw\b/g,'Empate');
  return (PREFIX[mid]?PREFIX[mid](f):'')+out;
}

/* ---------- estado ---------- */
const store={get(k,d){try{const v=localStorage.getItem('combina.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('combina.'+k,JSON.stringify(v))}catch(e){}}};
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()+i*864e5);const o={timeZone:TZ};
  return{key:ymd(d),wd:i===0?'Hoje':i===1?'Amanhã':d.toLocaleDateString('pt-PT',{...o,weekday:'short'}).replace('.',''),
    dd:d.toLocaleDateString('pt-PT',{...o,day:'2-digit'}),
    long:i===0?'Hoje':i===1?'Amanhã':d.toLocaleDateString('pt-PT',{...o,weekday:'long',day:'numeric',month:'short'}).replace('.','')}});
const PRESETS=[{n:'Qualquer',min:1.1,max:10},{n:'Seguras',min:1.1,max:1.5},{n:'Equilibradas',min:1.5,max:2.5},{n:'Arriscadas',min:2.5,max:10}];
const CRITERIA={
  random:{n:'Ao calhas',d:'Combinações variadas dentro dos teus filtros.'},
  prob:{n:'Prováveis',d:'Dá prioridade às seleções que o mercado acha mais prováveis.'},
  value:{n:'Com valor',d:'Só seleções em que a odd paga acima da probabilidade estimada pelo mercado.'}
};
const S={tab:'gerar',source:'loading',notice:'',day:days[0].key,games:3,leagues:new Set(),types:[],ranges:{},results:[],err:'',busy:false,
  target:{on:false,value:3,tol:.1},crit:store.get('crit','prob'),book:store.get('book','best'),
  showAll:false,dayData:{},oddsState:{},oddsHave:{},mk:{},quota:null,books:new Set(),
  saved:store.get('saved',[]),stake:store.get('stake',5),perRun:store.get('perRun',3)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(x,d=0)=>(x*100).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const sgn=x=>(x>0?'+':x<0?'−':'')+pct(Math.abs(x),1);
const dayLong=k=>days.find(d=>d.key===k)?.long??k;
const isDemo=()=>S.source==='demo';

/* ---------- servidor ---------- */
async function api(path){
  const r=await fetch(path,{headers:{Accept:'application/json'}});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j){const e=new Error(j?.error||'O servidor não respondeu.');e.code=j?.code||'no_server';throw e}
  return j;
}
async function ensureDay(date,force){
  const d=S.dayData[date];
  if(isDemo()||d?.status==='loading')return;
  if(!force&&d?.status==='ok'&&(d.all||!S.showAll))return;
  S.dayData[date]={status:'loading'};render();
  const all=S.showAll;
  try{const j=await api(`/api/events?date=${date}${all?'&all=1':''}`);S.dayData[date]={status:'ok',all,fixtures:j.fixtures}}
  catch(e){S.dayData[date]={status:'error',err:e.message}}
  render();
}
// Pede só os mercados que ainda não estão carregados para cada liga (cada mercado gasta créditos).
async function ensureOdds(date,leagueIds,mids=['ft']){
  mids=[...new Set(mids.filter(apiSupports))].sort();if(!mids.length)return;
  for(const id of leagueIds){
    const key=date+'|'+id;const have=S.oddsHave[key]||new Set();
    const need=mids.filter(m=>!have.has(m));if(!need.length)continue;
    if(!leaguesFor(date).some(l=>l.id===id))continue;
    S.oddsState[key]='loading';
    try{const j=await api(`/api/odds?date=${date}&league=${id}&markets=${need.join(',')}`);
      for(const f of j.fixtures){S.mk[f.id]={...(S.mk[f.id]||{}),...f.markets};
        for(const m of Object.values(f.markets))for(const s of m.sel)for(const b of Object.keys(s.odds))S.books.add(b)}
      need.forEach(m=>have.add(m));S.oddsHave[key]=have;S.oddsState[key]='ok';
      if(j.quota&&j.quota.remaining!=null)S.quota={remaining:j.quota.remaining,used:j.quota.used,total:j.quota.remaining+(j.quota.used||0)}}
    catch(e){S.oddsState[key]='error';throw e}
  }
}

/* ---------- consultas ---------- */
function leaguesFor(date){
  if(isDemo())return DEMO_LEAGUES.map(l=>({...l,count:demoFixtures(date,l).length,curated:true}));
  const fx=S.dayData[date]?.fixtures||[];const map=new Map();
  for(const f of fx){const id=String(f.league.id);let l=map.get(id);
    if(!l){const c=CUR.get(id);l={id,n:c?.n||f.league.name,c:c?.c||f.league.country,cc:c?.cc||(f.league.country||'').slice(0,3).toUpperCase(),curated:!!c,order:c?.order??999,count:0};map.set(id,l)}
    l.count++}
  return[...map.values()].sort((a,b)=>a.order-b.order||a.c.localeCompare(b.c)||a.n.localeCompare(b.n));
}
function fixturesFor(date,ids){
  if(isDemo())return DEMO_LEAGUES.filter(l=>!ids||ids.has(l.id)).flatMap(l=>demoFixtures(date,l));
  const L=new Map(leaguesFor(date).map(l=>[l.id,l]));
  return(S.dayData[date]?.fixtures||[]).filter(f=>!ids||ids.has(String(f.league.id)))
    .map(f=>({id:f.id,lg:L.get(String(f.league.id)),home:f.home,away:f.away,time:hhmm(f.ts),ts:f.ts}));
}
// Escolhe a odd conforme a casa definida nos Ajustes ("best" = a mais alta entre as casas).
function pickOdd(s){
  let odd,book;
  if(S.book==='best'){for(const[b,o]of Object.entries(s.odds))if(!odd||o>odd){odd=o;book=b}}
  else{odd=s.odds[S.book];book=S.book}
  if(!odd)return null;
  return{...s,odd,book,ev:s.p!=null?odd*s.p-1:null};
}
function selections(f,mid){
  if(f.demo)return demoSelections(f,mid);
  const m=S.mk[f.id]?.[mid];if(!m)return[];
  return m.sel.map(s=>pickOdd({pick:translate(mid,s,f),p:s.p,n:s.n,src:s.src,odds:s.odds})).filter(Boolean);
}
const selectedLeagues=()=>leaguesFor(S.day).filter(l=>S.leagues.has(l.id));

/* ---------- geração ---------- */
const rangeOf=mid=>S.ranges[mid]??{min:1.1,max:10};
const targetRange=()=>({lo:S.target.value*(1-S.target.tol),hi:S.target.value*(1+S.target.tol)});
// Seleções possíveis de um jogo: tipos escolhidos, dentro do intervalo de cada um (e com valor, se for esse o critério).
function candidates(f){
  const out=[];
  for(const mid of S.types){const {min,max}=rangeOf(mid);
    for(const s of selections(f,mid))if(s.odd>=min&&s.odd<=max&&(S.crit!=='value'||s.ev>0))out.push({...s,mid})}
  return out;
}
const legOf=(f,s)=>({fx:f.id,league:f.lg.n,country:f.lg.c,time:f.time,match:`${f.home} vs ${f.away}`,market:MK[s.mid].n,mid:s.mid,pick:s.pick,odd:s.odd,book:s.book,p:s.p,ev:s.ev,src:s.src,n:s.n});
function makeMulti(legs){
  legs=legs.slice().sort((a,b)=>String(a.time).localeCompare(String(b.time)));
  const total=legs.reduce((a,l)=>a*l.odd,1);
  const prob=legs.every(l=>l.p!=null)?legs.reduce((a,l)=>a*l.p,1):null;
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),day:S.day,legs,total,prob,ev:prob!=null?total*prob-1:null,stake:S.stake,
    sig:legs.map(l=>l.fx+'|'+l.pick).sort().join('/')};
}
function oddBounds(cands){
  const mins=cands.map(c=>Math.min(...c.sel.map(s=>s.odd))).sort((a,b)=>a-b);
  const maxs=cands.map(c=>Math.max(...c.sel.map(s=>s.odd))).sort((a,b)=>b-a);
  const prod=a=>a.slice(0,S.games).reduce((x,y)=>x*y,1);
  return{min:prod(mins),max:prod(maxs)};
}
// Escolhe uma seleção de uma lista ordenada pela pontuação, com alguma variedade.
const pickTop=(list,score,k=3)=>{const r=list.map(s=>({s,v:score(s)})).sort((a,b)=>b.v-a.v);return r[Math.floor(Math.random()*Math.min(k,r.length))].s};
const maxP=c=>Math.max(...c.sel.map(s=>s.p??0));
// Procura até `count` multis novas (fora de `taken`). Cada multi é a melhor pelo critério entre muitas tentativas,
// e os jogos já usados nas anteriores perdem prioridade, para os bilhetes não saírem todos iguais.
function search(fixtures,count,taken){
  const cands=fixtures.map(f=>({f,sel:candidates(f)})).filter(c=>c.sel.length);
  if(cands.length<S.games)return{multis:[],short:cands.length};
  const T=Math.log(S.target.value),{lo,hi}=targetRange();
  const usage=new Map(),out=[];let best=null;
  const used=c=>usage.get(c.f.id)||0;
  const order=()=>cands.map(c=>({c,k:(S.crit==='prob'?maxP(c):S.crit==='value'?1+Math.max(...c.sel.map(s=>s.ev??0)):1)*(.7+Math.random()*.6)*Math.pow(.45,used(c))}))
    .sort((a,b)=>b.k-a.k).map(x=>x.c);
  const overlap=m=>m.legs.filter(l=>usage.has(l.fx)).length;
  const rank=m=>(S.crit==='prob'?Math.log(m.prob||1e-9):S.crit==='value'?(m.ev??-1)*4:0)-overlap(m)*.35;
  for(let n=0;n<count;n++){
    let pick1=null;const want=S.crit==='random'&&!S.target.on?1:40;let seen=0;
    for(let attempt=0;attempt<1500&&seen<want;attempt++){
      const pick=(S.crit==='random'?shuffle(cands).sort((a,b)=>used(a)-used(b)):order()).slice(0,S.games);let chosen;
      if(S.target.on){
        let acc=0;chosen=[];
        pick.forEach((c,i)=>{const ideal=(T-acc)/(pick.length-i);
          const s=pickTop(c.sel,s=>-Math.abs(Math.log(s.odd)-ideal)+(S.crit==='prob'?(s.p??0)*.3:S.crit==='value'?(s.ev??0):0));
          chosen.push(s);acc+=Math.log(s.odd)});
        for(let pass=0;pass<2;pass++)pick.forEach((c,i)=>{const rest=acc-Math.log(chosen[i].odd);
          const s=c.sel.reduce((b,x)=>Math.abs(rest+Math.log(x.odd)-T)<Math.abs(rest+Math.log(b.odd)-T)?x:b,chosen[i]);
          if(Math.random()<.7){acc=rest+Math.log(s.odd);chosen[i]=s}});
        const total=Math.exp(acc);
        if(!best||Math.abs(acc-T)<Math.abs(Math.log(best)-T))best=total;
        if(total<lo||total>hi)continue;
      }else{
        chosen=pick.map(c=>S.crit==='random'?c.sel[Math.floor(Math.random()*c.sel.length)]:pickTop(c.sel,s=>S.crit==='prob'?(s.p??0):(s.ev??-1),2));
      }
      const m=makeMulti(pick.map((c,i)=>legOf(c.f,chosen[i])));
      if(taken.has(m.sig))continue;
      seen++;
      if(!pick1||rank(m)>rank(pick1))pick1=m;
    }
    if(!pick1)break;
    out.push(pick1);taken.add(pick1.sig);
    for(const l of pick1.legs)usage.set(l.fx,(usage.get(l.fx)||0)+1);
  }
  return{multis:out,best,bounds:oddBounds(cands)};
}
function noMultiMessage(r){
  if(r.short!=null){const n=r.short;
    if(S.crit==='value')return n?`Só ${n} ${n===1?'jogo tem':'jogos têm'} seleções com valor dentro dos teus filtros. Junta ligas, alarga os intervalos ou muda o critério.`:`Nenhuma seleção destes jogos tem valor positivo dentro dos teus filtros. ${S.book!=='best'?'Escolhe "Melhor odd" nos Ajustes, junta':'Junta'} ligas, alarga os intervalos ou experimenta "Prováveis".`;
    return n?`Só ${n} ${n===1?'jogo tem':'jogos têm'} odds dentro dos intervalos escolhidos. Alarga os intervalos, junta ligas ou baixa o número de jogos.`:'Nenhum jogo tem odds dentro dos intervalos escolhidos. Alarga os intervalos ou junta mercados.'}
  if(S.target.on&&r.bounds){const{lo,hi}=targetRange(),b=r.bounds;
    if(b.max<lo)return`Com ${S.games} jogos e estes filtros, a odd total vai no máximo até ${fmt(b.max)}. Junta jogos, sobe os máximos ou baixa o alvo.`;
    if(b.min>hi)return`Com ${S.games} jogos e estes filtros, a odd total nunca fica abaixo de ${fmt(b.min)}. Tira jogos, baixa os mínimos ou sobe o alvo.`;
    return`Não encontrei uma multi entre ${fmt(lo)} e ${fmt(hi)}. O mais perto foi ${fmt(r.best)}. Alarga a margem ou junta mercados.`}
  return'Nenhuma combinação cabe nos filtros escolhidos. Alarga os intervalos ou junta mercados.';
}
function pool(){return fixturesFor(S.day,new Set(selectedLeagues().map(l=>l.id)))}
async function generate(scroll=true){
  if(S.busy)return;
  S.err='';S.results=[];
  const sel=selectedLeagues();
  if(!sel.length){S.err='Escolhe pelo menos uma liga com jogos neste dia.';return render()}
  if(!S.types.length){S.err='Escolhe pelo menos um tipo de aposta.';return render()}
  if(!isDemo()&&!S.types.some(apiSupports)){S.err='Com a API grátis só há odds de Resultado Final, Mais/Menos Golos e Handicap. Escolhe pelo menos um destes.';return render()}
  for(const mid of S.types){const r=rangeOf(mid);if(!(r.min>=1.01&&r.max>=r.min)){S.err=`O intervalo de odds de "${MK[mid].n}" não é válido.`;return render()}}
  if(S.target.on&&!(S.target.value>=1.01)){S.err='Escreve uma odd total válida (maior que 1).';return render()}
  let p=pool();
  if(p.length<S.games){S.err=`Só há ${p.length} ${p.length===1?'jogo':'jogos'} nas ligas escolhidas para ${dayLong(S.day).toLowerCase()}. Junta ligas ou baixa o número de jogos.`;return render()}
  if(!isDemo()){
    S.busy=true;render();
    try{await ensureOdds(S.day,sel.map(l=>l.id),S.types)}
    catch(e){S.busy=false;S.err=`Não consegui carregar as odds: ${e.message}`;return render()}
    S.busy=false;
    p=p.filter(f=>S.mk[f.id]&&Object.keys(S.mk[f.id]).length);
    if(!p.length){S.err='Ainda não há odds para estes jogos. As casas costumam publicá-las uns dias antes.';return render()}
    if(S.book!=='best'&&!p.some(f=>S.types.some(mid=>selections(f,mid).length))){S.err=`A casa escolhida nos Ajustes (${S.book}) não tem odds para estes jogos. Escolhe "Melhor odd" ou outra casa.`;return render()}
  }
  const r=search(p,S.perRun,new Set());
  S.results=r.multis;
  if(!S.results.length)S.err=noMultiMessage(r);
  else if(S.results.length<S.perRun)S.err=`Só encontrei ${S.results.length} ${S.results.length===1?'combinação diferente':'combinações diferentes'} com estes filtros.`;
  render();
  if(scroll&&S.results.length)document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- folhas ---------- */
let draft=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
const SHEETS={leagues:'Ligas',types:'Tipos de aposta',ranges:'Odds de cada seleção',target:'Odd total'};
function openSheet(kind){
  draft=kind==='leagues'?new Set(S.leagues):kind==='types'?S.types.slice():null;
  const el=document.getElementById('sheet');el.hidden=false;el.dataset.kind=kind;
  const searchable=kind==='leagues'||kind==='types';
  el.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${SHEETS[kind]}"><div class="grab"></div>
  <div class="sh"><h2>${SHEETS[kind]}</h2><button data-close aria-label="Fechar">${I.x}</button></div>
  <div class="sb">${searchable?`<label class="search" for="q">${I.search}<input id="q" type="search" placeholder="${kind==='leagues'?'Procurar liga ou país':'Procurar tipo de aposta'}" autocomplete="off"></label>`:''}
  ${kind==='leagues'?'<div class="quick" id="quick"></div>':''}<div id="list"></div></div>
  <div class="sf"><span class="meta" id="sfmeta"></span><button class="go" data-confirm>${searchable?'Confirmar':'Feito'}</button></div></div></div>`;
  drawSheet();document.body.style.overflow='hidden';
}
function drawSheet(){
  const el=document.getElementById('sheet');const kind=el.dataset.kind,list=document.getElementById('list');if(!list)return;
  const q=norm(document.getElementById('q')?.value||'');
  if(kind==='leagues'){
    const all=leaguesFor(S.day);
    document.getElementById('quick').innerHTML=`<button data-q="all">Todas em destaque</button><button data-q="none">Limpar</button>${!isDemo()?`<button data-q="toggle">${S.showAll?'Só em destaque':'Ver todas as ligas'}</button>`:''}`;
    const ls=all.filter(l=>(l.curated||S.showAll||draft.has(l.id))&&(!q||norm(l.n+' '+l.c).includes(q)));
    list.innerHTML=ls.length?ls.map(l=>`<label class="lrow${draft.has(l.id)?' on':''}"><span class="cc">${esc(l.cc)}</span>
      <span class="nm"><b>${esc(l.n)}</b><small>${esc(l.c)} · ${l.count} ${l.count===1?'jogo':'jogos'}</small></span>
      <input type="checkbox" data-lg="${l.id}" ${draft.has(l.id)?'checked':''}><span class="box"></span></label>`).join('')
      :`<p class="hint">${!isDemo()&&S.dayData[S.day]?.status!=='ok'?'Os jogos deste dia ainda não carregaram.':q?'Nenhuma liga encontrada.':'Não há jogos por começar nas ligas em destaque neste dia.'}</p>`;
    const tot=all.filter(l=>draft.has(l.id)).reduce((a,l)=>a+l.count,0);
    document.getElementById('sfmeta').textContent=`${draft.size} ${draft.size===1?'liga':'ligas'} · ${tot} jogos`;
  }else if(kind==='types'){
    // Com a API, os mercados disponíveis aparecem primeiro; os outros ficam num grupo à parte, desativados.
    const avail=m=>isDemo()||apiSupports(m.id)||draft.includes(m.id);
    const tile=m=>{const on=draft.includes(m.id),off=(!on&&draft.length>=6)||!avail(m);
      return`<label class="tile${on?' on':''}${off?' off':''}"><input type="checkbox" data-mk="${m.id}" ${on?'checked':''} ${off?'disabled':''}>${m.n}</label>`};
    const match=m=>!q||norm(m.n).includes(q);
    const groups=[...new Set(MARKETS.map(m=>m.g))];
    let html=isDemo()?groups.map(g=>{const ms=MARKETS.filter(m=>m.g===g&&match(m));return ms.length?`<p class="cat">${g}</p><div class="grid">${ms.map(tile).join('')}</div>`:''}).join('')
      :(()=>{const ms=MARKETS.filter(m=>avail(m)&&match(m));return ms.length?`<p class="cat">Com odds reais</p><div class="grid">${ms.map(tile).join('')}</div>`:''})();
    const na=MARKETS.filter(m=>!avail(m)&&match(m));
    if(na.length)html+=`<p class="cat">Sem odds na API grátis</p><p class="hint" style="margin:0 2px 10px">A The Odds API grátis só dá estes mercados no modo de exemplo.</p><div class="grid">${na.map(tile).join('')}</div>`;
    list.innerHTML=html||'<p class="hint">Nenhum mercado encontrado.</p>';
    document.getElementById('sfmeta').textContent=`${draft.length} de 6 escolhidos`;
  }else if(kind==='ranges'){
    list.innerHTML=S.types.map(mid=>{const r=rangeOf(mid);return`<div class="orow"><h3>${MK[mid].n}</h3>
      <div class="oin"><label for="min-${mid}">Mín<input id="min-${mid}" type="number" step="0.05" min="1.01" inputmode="decimal" value="${r.min}" data-range="${mid}" data-k="min"></label>
      <label for="max-${mid}">Máx<input id="max-${mid}" type="number" step="0.05" min="1.01" inputmode="decimal" value="${r.max}" data-range="${mid}" data-k="max"></label></div>
      <div class="pre">${PRESETS.map((p,pi)=>`<button data-preset="${mid}:${pi}" aria-pressed="${r.min===p.min&&r.max===p.max}">${p.n}${pi?` ${fmt(p.min)}–${fmt(p.max)}`:''}</button>`).join('')}</div></div>`}).join('');
    document.getElementById('sfmeta').textContent='Opcional. Se não mexeres, vale qualquer odd.';
  }else if(kind==='target'){
    const{lo,hi}=targetRange();
    list.innerHTML=`<div class="tgl"><span><b>Escolher a odd total</b><small>Desligado, cada multi fica com a odd que calhar.</small></span>
      <button class="switch" data-act="target" role="switch" aria-checked="${S.target.on}" aria-label="Escolher a odd total"><span></span></button></div>
      ${S.target.on?`<label class="tv" for="tval">Quero perto de<input id="tval" type="number" step="0.1" min="1.01" inputmode="decimal" value="${S.target.value}"></label>
      <div class="pre" role="group" aria-label="Margem">${[[.05,'Apertada ±5%'],[.1,'Normal ±10%'],[.2,'Larga ±20%']].map(([t,n])=>`<button data-tol="${t}" aria-pressed="${S.target.tol===t}">${n}</button>`).join('')}</div>`:''}`;
    document.getElementById('sfmeta').innerHTML=S.target.on?(S.target.value>=1.01?`Multis entre <b>${fmt(lo)}</b> e <b>${fmt(hi)}</b>`:'Escreve uma odd maior que 1.'):'';
  }
}
function closeSheet(){const el=document.getElementById('sheet');el.hidden=true;el.innerHTML='';document.body.style.overflow='';draft=null}

/* ---------- eventos ---------- */
function setDay(k){S.day=k;S.results=[];S.err='';render();ensureDay(k)}
async function loadQuota(){S.quotaErr='';try{S.quota=await api('/api/status')}catch(e){S.quotaErr=e.message}if(S.tab==='ajustes')render()}
document.addEventListener('click',async e=>{
  if(e.target.matches('[data-scrim]')){closeSheet();render();return}
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;S.confirmDel=false;S.err='';render();window.scrollTo(0,0);if(d.tab==='ajustes'&&!isDemo())loadQuota();return}
  if(d.day){setDay(d.day);return}
  if('retryday' in d){ensureDay(S.day,true);return}
  if(d.games){S.games=Math.min(10,Math.max(2,S.games+ +d.games));render();return}
  if(d.per){S.perRun=Math.min(5,Math.max(1,S.perRun+ +d.per));store.set('perRun',S.perRun);render();return}
  if(d.crit){S.crit=d.crit;store.set('crit',S.crit);S.err='';render();return}
  if(d.open){openSheet(d.open);return}
  if('close' in d){closeSheet();render();return}
  if(d.q){
    if(d.q==='all')leaguesFor(S.day).forEach(l=>{if(l.curated)draft.add(l.id)});
    else if(d.q==='none')draft.clear();
    else{S.showAll=!S.showAll;ensureDay(S.day)}
    drawSheet();return}
  if('confirm' in d){
    const kind=document.getElementById('sheet').dataset.kind;
    if(kind==='leagues')S.leagues=draft;
    else if(kind==='types'){const added=draft.some(id=>!S.types.includes(id));S.types=draft;for(const k of Object.keys(S.ranges))if(!S.types.includes(k))delete S.ranges[k];
      closeSheet();S.err='';render();if(added)openSheet('ranges');return}
    closeSheet();S.err='';render();return}
  if(d.preset){const[mid,pi]=d.preset.split(':');const p=PRESETS[+pi];S.ranges[mid]={min:p.min,max:p.max};drawSheet();return}
  if(d.act==='target'){S.target.on=!S.target.on;S.err='';drawSheet();if(S.target.on)document.getElementById('tval')?.focus();return}
  if(d.tol){S.target.tol=+d.tol;drawSheet();return}
  if(d.loadodds){S.err='';const p=ensureOdds(S.day,[d.loadodds],['ft']);render();try{await p}catch(err){S.err=`Não consegui carregar as odds: ${err.message}`}render();return}
  if(d.act==='toggleall'){S.showAll=!S.showAll;render();ensureDay(S.day);return}
  if(d.act==='gen'){generate();return}
  if(d.act==='source'){S.source=isDemo()?'api':'demo';if(!isDemo())S.types=S.types.filter(apiSupports);S.notice='';S.leagues=new Set();S.results=[];S.err='';render();ensureDay(S.day);if(!isDemo())loadQuota();return}
  if(d.act==='delask'){S.confirmDel=true;render();return}
  if(d.act==='delno'){S.confirmDel=false;render();return}
  if(d.act==='delyes'){S.saved=[];store.set('saved',[]);S.confirmDel=false;render();return}
  if(d.reroll!==undefined){
    const i=+d.reroll;const p=pool().filter(f=>f.demo||S.mk[f.id]);
    const r=search(p,1,new Set(S.results.map(m=>m.sig)));
    if(r.multis[0]){S.results[i]=r.multis[0];S.err=''}else S.err='Não encontrei outra combinação diferente com estes filtros.';render();return}
  if(d.save){
    const m=S.results.find(x=>x.id===d.save);if(!m)return;
    const idx=S.saved.findIndex(s=>s.id===m.id);
    if(idx>=0)S.saved.splice(idx,1);else S.saved.unshift(m);
    store.set('saved',S.saved);render();return}
  if(d.remove){S.saved=S.saved.filter(s=>s.id!==d.remove);store.set('saved',S.saved);render();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.lg){t.checked?draft.add(t.dataset.lg):draft.delete(t.dataset.lg);drawSheet();return}
  if(t.dataset.mk){const id=t.dataset.mk;if(t.checked&&!draft.includes(id)&&draft.length<6)draft.push(id);else if(!t.checked)draft=draft.filter(x=>x!==id);drawSheet();return}
  if(t.id==='book'){S.book=t.value;store.set('book',S.book);S.results=[];render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){drawSheet();return}
  if(t.id==='tval'){S.target.value=parseFloat(String(t.value).replace(',','.'));const m=document.getElementById('sfmeta');
    if(m)m.innerHTML=S.target.value>=1.01?`Multis entre <b>${fmt(targetRange().lo)}</b> e <b>${fmt(targetRange().hi)}</b>`:'Escreve uma odd maior que 1.';return}
  if(t.dataset.range){const r={...rangeOf(t.dataset.range)};r[t.dataset.k]=parseFloat(String(t.value).replace(',','.'));S.ranges[t.dataset.range]=r;
    t.closest('.orow').querySelectorAll('[data-preset]').forEach(b=>{const p=PRESETS[+b.dataset.preset.split(':')[1]];b.setAttribute('aria-pressed',r.min===p.min&&r.max===p.max)});return}
  if(t.dataset.stake){
    const v=Math.max(0,parseFloat(t.value)||0);const m=S.results.find(x=>x.id===t.dataset.stake)||S.saved.find(x=>x.id===t.dataset.stake);
    if(m){m.stake=v;const out=document.querySelector(`[data-ret="${m.id}"]`);if(out)out.textContent=fmt(v*m.total)+' €';const s=S.saved.find(x=>x.id===m.id);if(s){s.stake=v;store.set('saved',S.saved)}}return}
  if(t.id==='defstake'){S.stake=Math.max(0,parseFloat(t.value)||0);store.set('stake',S.stake)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('sheet').hidden){closeSheet();render()}});

/* ---------- arranque ---------- */
(async function start(){
  render();
  const defaults=()=>{S.types=['ft','ou'];S.ranges={ft:{min:1.3,max:2.5},ou:{min:1.3,max:2.5}}};
  try{
    const j=await api(`/api/events?date=${S.day}`);
    S.source='api';S.apiOk=true;S.dayData[S.day]={status:'ok',fixtures:j.fixtures};
    S.leagues=new Set(['soccer_portugal_primeira_liga','soccer_epl','soccer_spain_la_liga'].filter(id=>leaguesFor(S.day).some(l=>l.id===id)));
    render();
  }catch(e){
    if(e.code&&!['missing_key','no_server'].includes(e.code)){
      // O servidor está a funcionar mas a API recusou: mostra o erro em vez de esconder.
      S.source='api';S.apiOk=true;S.dayData[S.day]={status:'error',err:e.message};render();return;
    }
    S.source='demo';S.apiOk=false;
    S.notice=e.code==='missing_key'?'Falta configurar a chave da The Odds API. Até lá, estás a ver dados de exemplo.':'Sem ligação ao servidor. Estás a ver dados de exemplo.';
    S.leagues=new Set(['por1','epl','esp']);defaults();
    await generate(false);
  }
})();
</script>
</body>
</html>
